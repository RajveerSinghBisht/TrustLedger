<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="stepArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad2)"/>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1120" height="50" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="60" y="51" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">PRAMAAN End-to-End Operational Lifecycle Journey</text>
  <text x="1130" y="51" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">7 Core Stages</text>

  <!-- Flow Steps -->
  <!-- Step 1 -->
  <g transform="translate(40, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#0284c7"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">01</text>
    <text x="50" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">IDENTITY</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>
    
    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DID Onboard</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Admin registers</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DID on-chain via</text>
    <text x="12" y="141" fill="#cbd5e1" font-family="monospace" font-size="10">IdentityRegistry</text>
    <text x="12" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Subject signs</text>
    <text x="12" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">EIP-191 Nonce</text>
    <text x="12" y="201" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Challenge for JWT.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#0c4a6e"/>
    <text x="72" y="251" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MetaMask Auth</text>
  </g>

  <!-- Arrow 1-2 -->
  <line x1="188" y1="235" x2="200" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 2 -->
  <g transform="translate(204, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#059669"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">02</text>
    <text x="50" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">INGESTION</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Mint Asset</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Compute SHA-256</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">file fingerprint.</text>
    <text x="12" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AES-256-GCM</text>
    <text x="12" y="163" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">envelope encrypt.</text>
    <text x="12" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ERC-721 token</text>
    <text x="12" y="203" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">minted on EVM.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#064e3b"/>
    <text x="72" y="251" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AssetRegistry NFT</text>
  </g>

  <!-- Arrow 2-3 -->
  <line x1="352" y1="235" x2="364" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 3 -->
  <g transform="translate(368, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#d97706"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">03</text>
    <text x="50" y="34" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">POLICY</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Grant Access</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Manager grants</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">permission</text>
    <text x="12" y="141" fill="#cbd5e1" font-family="monospace" font-size="10">[READ/WRITE]</text>
    <text x="12" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Appends to</text>
    <text x="12" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">version timeline</text>
    <text x="12" y="201" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">with validFrom.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#78350f"/>
    <text x="72" y="251" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AccessControl</text>
  </g>

  <!-- Arrow 3-4 -->
  <line x1="516" y1="235" x2="528" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 4 -->
  <g transform="translate(532, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#7c3aed"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">04</text>
    <text x="50" y="34" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DOWNLOAD</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Decrypt &amp; Proof</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Check policy now.</text>
    <text x="12" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Emit on-chain</text>
    <text x="12" y="143" fill="#cbd5e1" font-family="monospace" font-size="10">AssetAccessed</text>
    <text x="12" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">event.</text>
    <text x="12" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Generate signed</text>
    <text x="12" y="203" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Proof Bundle.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#4c1d95"/>
    <text x="72" y="251" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">X-Proof-Bundle</text>
  </g>

  <!-- Arrow 4-5 -->
  <line x1="680" y1="235" x2="692" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 5 -->
  <g transform="translate(696, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#dc2626"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">05</text>
    <text x="50" y="34" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">REVOKE</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Seal Version</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Manager revokes</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">permission.</text>
    <text x="12" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Previous record</text>
    <text x="12" y="163" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">gets validUntil</text>
    <text x="12" y="181" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">closed. Never</text>
    <text x="12" y="199" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">deleted from chain.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#7f1d1d"/>
    <text x="72" y="251" fill="#fecaca" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Append Only</text>
  </g>

  <!-- Arrow 5-6 -->
  <line x1="844" y1="235" x2="856" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 6 -->
  <g transform="translate(860, 95)">
    <rect width="145" height="280" rx="8" fill="url(#stepGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#0891b2"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">06</text>
    <text x="50" y="34" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AUDIT</text>
    <line x1="12" y1="56" x2="133" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Query Time T</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Auditor submits</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">historical query</text>
    <text x="12" y="141" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">for past date.</text>
    <text x="12" y="165" fill="#cbd5e1" font-family="monospace" font-size="9">checkPermissionAtTime</text>
    <text x="12" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">proves past</text>
    <text x="12" y="203" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">legitimacy.</text>

    <rect x="12" y="235" width="121" height="24" rx="4" fill="#164e63"/>
    <text x="72" y="251" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Core USP</text>
  </g>

  <!-- Arrow 6-7 -->
  <line x1="1008" y1="235" x2="1020" y2="235" stroke="#38bdf8" stroke-width="2" marker-end="url(#stepArrow)"/>

  <!-- Step 7 -->
  <g transform="translate(1024, 95)">
    <rect width="136" height="280" rx="8" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#059669"/>
    <text x="28" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">07</text>
    <text x="50" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VERIFY</text>
    <line x1="12" y1="56" x2="124" y2="56" stroke="#334155" stroke-width="1"/>

    <text x="12" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Independent</text>
    <text x="12" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">External depot</text>
    <text x="12" y="123" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">verifies proof</text>
    <text x="12" y="141" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">via public RPC.</text>
    <text x="12" y="159" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero backend</text>
    <text x="12" y="177" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">dependency.</text>

    <rect x="12" y="235" width="112" height="24" rx="4" fill="#064e3b"/>
    <text x="68" y="251" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Level 2 Verifier</text>
  </g>
</svg>
