<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="verifyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGradVer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowVerCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowVerGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1100" height="680" fill="url(#verifyBgGrad)"/>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="54" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="68" cy="47" r="10" fill="#10b981" opacity="0.2"/>
  <circle cx="68" cy="47" r="5" fill="#10b981"/>
  <text x="90" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Flow 6: Independent Third-Party Proof Bundle Verification (Level 2 Offline/Decentralized)</text>
  <rect x="880" y="34" width="160" height="26" rx="13" fill="#064e3b"/>
  <text x="960" y="51" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Vendor Trust</text>

  <!-- Left: The Verifier & Proof Bundle Input -->
  <g transform="translate(40, 95)">
    <rect width="360" height="550" rx="8" fill="url(#cardGradVer)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="3" fill="#0284c7"/><text x="51" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INPUT</text>
    <text x="96" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Airbase Depot / Auditor</text>

    <!-- Depot Context -->
    <text x="16" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">1. Operating in Isolated Network:</text>
    <rect x="16" y="78" width="328" height="66" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Depot has NO account on PRAMAAN</text>
    <text x="28" y="120" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Holds only the downloaded document + proof</text>
    <text x="28" y="136" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">(Zero trust in central backend database)</text>

    <!-- The Bundle Payload -->
    <text x="16" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2. Exported Proof Certificate (.json):</text>
    <rect x="16" y="182" width="328" height="230" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="28" y="204" fill="#a78bfa">{</text>
      <text x="38" y="224">"assetId": 1042,</text>
      <text x="38" y="244">"assetHash": "&lt;SHA256_HASH&gt;",</text>
      <text x="38" y="264">"accessedBy": "did:trustledger:&lt;USER_ADDRESS&gt;",</text>
      <text x="38" y="284">"accessTimestamp": 1735689600,</text>
      <text x="38" y="304">"permissionVersionUsed": {</text>
      <text x="48" y="324">"permissionId": 87,</text>
      <text x="48" y="344">"state": "GRANTED"</text>
      <text x="38" y="364">},</text>
      <text x="38" y="384">"onChainTxRef": "&lt;ON_CHAIN_TX_HASH&gt;",</text>
      <text x="38" y="404" fill="#34d399">"signature": "&lt;EIP191_SIGNATURE&gt;"</text>
      <text x="28" y="420" fill="#a78bfa">}</text>
    </g>

    <!-- Action -->
    <rect x="16" y="430" width="328" height="96" rx="6" fill="#141e2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="28" y="455" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Paste into Standalone Verifier:</text>
    <text x="28" y="475" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Via <tspan fill="#e2e8f0">/verify</tspan> portal or offline CLI script.</text>
    <text x="28" y="495" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Connects to ANY public or private EVM node.</text>
    <text x="28" y="513" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Requires NO login or API credentials.</text>
  </g>

  <!-- Arrow between columns -->
  <path d="M 400 370 L 435 370" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrowVerCyan)"/>

  <!-- Right: 5 Independent Verification Checks -->
  <g transform="translate(445, 95)">
    <rect width="615" height="550" rx="8" fill="url(#cardGradVer)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="3" fill="#059669"/><text x="51" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">5 CHECKS</text>
    <text x="96" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Decentralized Cryptographic Verification Pipeline</text>

    <!-- Check 1 -->
    <rect x="16" y="55" width="583" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="88" r="12" fill="#0284c7"/><text x="40" y="93" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="65" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Protocol Authority Signature Recovery</text>
    <text x="65" y="96" fill="#cbd5e1" font-family="monospace" font-size="10">recovered = ethers.verifyMessage(canonicalBundleJson, bundle.signature)</text>
    <text x="65" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Verifies signature matches PRAMAAN Protocol Authority public key (No tampering).</text>

    <!-- Check 2 -->
    <rect x="16" y="130" width="583" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="163" r="12" fill="#059669"/><text x="40" y="168" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="65" y="153" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EVM Transaction &amp; Block Inclusion Receipt</text>
    <text x="65" y="171" fill="#cbd5e1" font-family="monospace" font-size="10">receipt = provider.getTransactionReceipt(bundle.onChainTxRef)</text>
    <text x="65" y="187" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Asserts receipt.status == 1 and transaction is immutably anchored in block header.</text>

    <!-- Check 3 -->
    <rect x="16" y="205" width="583" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="238" r="12" fill="#d97706"/><text x="40" y="243" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="65" y="228" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Receipt Log Event Parameter Match</text>
    <text x="65" y="246" fill="#cbd5e1" font-family="monospace" font-size="10">event AssetAccessed(assetId, accessorDID, timestamp, permissionId)</text>
    <text x="65" y="262" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Verifies log parameters match bundle fields byte-for-byte on-chain.</text>

    <!-- Check 4 -->
    <rect x="16" y="280" width="583" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="313" r="12" fill="#7c3aed"/><text x="40" y="318" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="65" y="303" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">On-Chain Asset Hash Consistency</text>
    <text x="65" y="321" fill="#cbd5e1" font-family="monospace" font-size="10">onChainAsset = AssetRegistry.getAsset(bundle.assetId)</text>
    <text x="65" y="337" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Verifies onChainAsset.assetHash == bundle.assetHash (Original file unaltered).</text>

    <!-- Check 5 -->
    <rect x="16" y="355" width="583" height="66" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="40" cy="388" r="12" fill="#0891b2"/><text x="40" y="393" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <text x="65" y="378" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Policy-at-the-Time Verification</text>
    <text x="65" y="396" fill="#cbd5e1" font-family="monospace" font-size="10">perm = AccessControl.checkPermissionAtTime(assetId, did, READ, timestamp)</text>
    <text x="65" y="412" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Confirms policy version in bundle was actively GRANTED at that historical second.</text>

    <!-- Final Verdict Box -->
    <rect x="16" y="440" width="583" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="35" y="470" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✓ INDEPENDENT AUDIT VERDICT: 100% CRYPTOGRAPHICALLY VALID</text>
    <text x="35" y="492" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">The document access was legitimate, untampered, and permanently proven by the blockchain.</text>
    <text x="35" y="510" fill="#6ee7b7" font-family="monospace" font-size="10">Verified completely without contacting the central PRAMAAN server.</text>
  </g>
</svg>
