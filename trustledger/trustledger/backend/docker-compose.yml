# Development infrastructure only — not part of the product architecture.
# One service: Postgres. Nothing else.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (also deletes the persisted volume)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustledger
      POSTGRES_PASSWORD: trustledger
      POSTGRES_DB: trustledger
    ports:
      - "5432:5432"
    volumes:
      - trustledger_postgres_data:/var/lib/postgresql/data

volumes:
  trustledger_postgres_data:
