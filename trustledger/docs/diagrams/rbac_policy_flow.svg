<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111d"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowRbac" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowCyan4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="url(#bgGrad4)"/>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="54" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="68" cy="47" r="10" fill="#f59e0b" opacity="0.2"/>
  <circle cx="68" cy="47" r="5" fill="#f59e0b"/>
  <text x="90" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Flow 3: Dynamic RBAC — Append-Only On-Chain Policy Timeline</text>
  <rect x="880" y="34" width="160" height="26" rx="13" fill="#78350f"/>
  <text x="960" y="51" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AccessControl.sol</text>

  <!-- Left: Request & Backend Processing -->
  <g transform="translate(40, 100)">
    <rect width="360" height="490" rx="8" fill="url(#cardGrad4)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="3" fill="#0284c7"/><text x="51" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 1 &amp; 2</text>
    <text x="96" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Manager Policy Assignment</text>
    
    <text x="16" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">1. Manager selects target parameters:</text>
    <rect x="16" y="80" width="328" height="110" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g font-family="monospace" font-size="11" fill="#cbd5e1">
      <text x="28" y="104">Target Asset:   #1042</text>
      <text x="28" y="126">Subject DID:    did:trustledger:&lt;USER_ADDRESS&gt;</text>
      <text x="28" y="148">Action Type:    READ (0)</text>
      <text x="28" y="170">Policy State:   GRANTED (1)</text>
    </g>

    <text x="16" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2. API Gateway Role Verification:</text>
    <rect x="16" y="232" width="328" height="96" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="28" y="254">• Validates caller JWT</text>
      <text x="28" y="274">• Fresh call to IdentityRegistry:</text>
      <text x="38" y="294" fill="#38bdf8">role in [ADMIN, MANAGER] &amp;&amp; isActive</text>
      <text x="28" y="314" fill="#34d399">✓ Relayer authorized to submit tx</text>
    </g>

    <text x="16" y="356" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">3. Blockchain Transaction Submission:</text>
    <rect x="16" y="370" width="328" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="28" y="392">Relayer calls on AccessControl.sol:</text>
      <text x="28" y="412" fill="#f59e0b">setPermission(</text>
      <text x="38" y="430" fill="#fde68a">1042, "did:...", READ, GRANTED</text>
      <text x="28" y="448" fill="#f59e0b">)</text>
    </g>
  </g>

  <!-- Arrow between columns -->
  <path d="M 400 345 L 462 345" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowRbac)"/>

  <!-- Right: On-Chain Append-Only Timeline Engine -->
  <g transform="translate(470, 100)">
    <rect width="590" height="490" rx="8" fill="url(#cardGrad4)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="20" rx="3" fill="#d97706"/><text x="51" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 3</text>
    <text x="96" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AccessControl.sol Timeline Engine</text>

    <!-- Formula Box -->
    <rect x="16" y="60" width="558" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="30" y="84" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Storage Key Invariant (Append-Only Array):</text>
    <text x="30" y="104" fill="#e0e7ff" font-family="monospace" font-size="11">mapping(bytes32 =&gt; Permission[]) where key = keccak256(assetId, subjectDID, action)</text>

    <!-- Visual Timeline Progression -->
    <text x="16" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">On-Chain State Progression (Never Overwritten):</text>
    
    <!-- Version 1 Card (Sealed) -->
    <rect x="16" y="164" width="558" height="96" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="30" y="176" width="80" height="20" rx="3" fill="#334155"/><text x="70" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERSION #1</text>
    <text x="120" y="191" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SEALED (PAST)</text>
    <g font-family="monospace" font-size="11" fill="#cbd5e1">
      <text x="30" y="218">Permission ID: 12  | State: GRANTED</text>
      <text x="30" y="240">validFrom: <tspan fill="#38bdf8">1704067200 (2024-01-01)</tspan>  -&gt;  validUntil: <tspan fill="#f87171">1735689600 (2025-01-01)</tspan></text>
    </g>

    <!-- Version 2 Card (Currently Active) -->
    <rect x="16" y="274" width="558" height="96" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="30" y="286" width="80" height="20" rx="3" fill="#065f46"/><text x="70" y="300" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERSION #2</text>
    <text x="120" y="301" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CURRENTLY ACTIVE</text>
    <g font-family="monospace" font-size="11" fill="#cbd5e1">
      <text x="30" y="328">Permission ID: 87  | State: GRANTED (Extended / Modified)</text>
      <text x="30" y="350">validFrom: <tspan fill="#38bdf8">1735689600 (2025-01-01)</tspan>  -&gt;  validUntil: <tspan fill="#34d399">0 (INDEFINITE / ACTIVE)</tspan></text>
    </g>

    <!-- Emitted Event -->
    <rect x="16" y="386" width="558" height="88" rx="6" fill="#141e2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="30" y="410" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Emitted On-Chain Event (Immutable Audit Log):</text>
    <text x="30" y="432" fill="#93c5fd" font-family="monospace" font-size="11">event PermissionChanged(uint256 indexed permissionId, uint256 assetId,</text>
    <text x="80" y="452" fill="#93c5fd" font-family="monospace" font-size="11">string subjectDID, Action action, PermissionState state, uint256 validFrom);</text>
  </g>
</svg>
