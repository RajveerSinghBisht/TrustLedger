<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- Gradients for Cards -->
    <linearGradient id="greenPill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <linearGradient id="bluePill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="redPill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="purplePill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrowNext" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ==================== CARD 1: 10:00 AM (GREEN) ==================== -->
  <g transform="translate(30, 30)">
    <rect x="0" y="24" width="275" height="280" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5" filter="url(#cardShadow)"/>
    <g filter="url(#pillShadow)">
      <rect x="62" y="5" width="150" height="38" rx="19" fill="url(#greenPill)"/>
      <text x="137" y="30" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">10:00 AM</text>
    </g>

    <!-- Icon -->
    <g transform="translate(112, 58)">
      <circle cx="25" cy="22" r="16" fill="#16a34a"/>
      <path d="M 2 54 C 2 40 12 36 25 36 C 38 36 48 40 48 54 Z" fill="#16a34a"/>
      <circle cx="37" cy="38" r="9" fill="#ffffff"/>
      <path d="M 33 38 L 36 41 L 42 34" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="137" y="132" fill="#15803d" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.8">ACCESS GRANTED</text>

    <g transform="translate(20, 146)" font-size="12" fill="#334155">
      <text x="0" y="16" font-weight="600">📄 Asset: <tspan fill="#0f172a" font-weight="800">RADAR-TRX-09</tspan></text>
      <text x="0" y="38" font-weight="600">🔑 Action: <tspan fill="#16a34a" font-weight="800">READ (Telemetry)</tspan></text>
      <text x="0" y="60" font-weight="600">👤 To: <tspan fill="#0f172a" font-weight="700">Officer A (Avionics)</tspan></text>
      <text x="0" y="82" font-weight="600">⚙️ Record: <tspan fill="#0284c7" font-weight="700">Permission ID: 4</tspan></text>
      <text x="0" y="104" fill="#64748b" font-size="11" font-weight="600">⏱️ validFrom: 10:00 AM (t=1)</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="312" y1="180" x2="338" y2="180" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowNext)"/>

  <!-- ==================== CARD 2: 11:32 AM (BLUE) ==================== -->
  <g transform="translate(345, 30)">
    <rect x="0" y="24" width="275" height="280" rx="18" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2.5" filter="url(#cardShadow)"/>
    <g filter="url(#pillShadow)">
      <rect x="62" y="5" width="150" height="38" rx="19" fill="url(#bluePill)"/>
      <text x="137" y="30" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">11:32 AM</text>
    </g>

    <!-- Icon -->
    <g transform="translate(112, 58)">
      <rect x="10" y="8" width="30" height="42" rx="4" fill="#0284c7"/>
      <line x1="16" y1="18" x2="32" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="26" x2="34" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="34" x2="28" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="137" y="132" fill="#0369a1" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.8">ACCESS OCCURS</text>

    <g transform="translate(20, 146)" font-size="12" fill="#334155">
      <text x="0" y="16" font-weight="600">📄 Asset: <tspan fill="#0f172a" font-weight="800">RADAR-TRX-09</tspan></text>
      <text x="0" y="38" font-weight="600">🔑 Action: <tspan fill="#0284c7" font-weight="800">READ (Decrypted)</tspan></text>
      <text x="0" y="60" font-weight="600">👤 By: <tspan fill="#0f172a" font-weight="700">Officer A (Avionics)</tspan></text>
      <text x="0" y="82" font-weight="600">⚙️ Check: <tspan fill="#16a34a" font-weight="700">state == GRANTED</tspan></text>
      <text x="0" y="104" fill="#0369a1" font-size="11" font-weight="700">🛡️ Proof Receipt Emitted</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="627" y1="180" x2="653" y2="180" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowNext)"/>

  <!-- ==================== CARD 3: 12:00 PM (RED) ==================== -->
  <g transform="translate(660, 30)">
    <rect x="0" y="24" width="275" height="280" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2.5" filter="url(#cardShadow)"/>
    <g filter="url(#pillShadow)">
      <rect x="62" y="5" width="150" height="38" rx="19" fill="url(#redPill)"/>
      <text x="137" y="30" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">12:00 PM</text>
    </g>

    <!-- Icon -->
    <g transform="translate(112, 58)">
      <circle cx="25" cy="22" r="16" fill="#dc2626"/>
      <path d="M 2 54 C 2 40 12 36 25 36 C 38 36 48 40 48 54 Z" fill="#dc2626"/>
      <circle cx="37" cy="38" r="9" fill="#ffffff"/>
      <path d="M 33 34 L 41 42 M 41 34 L 33 42" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="137" y="132" fill="#b91c1c" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.8">ACCESS REVOKED</text>

    <g transform="translate(20, 146)" font-size="12" fill="#334155">
      <text x="0" y="16" font-weight="600">📄 Asset: <tspan fill="#0f172a" font-weight="800">RADAR-TRX-09</tspan></text>
      <text x="0" y="38" font-weight="600">🔑 Action: <tspan fill="#b91c1c" font-weight="800">READ (Revoked)</tspan></text>
      <text x="0" y="60" font-weight="600">👤 From: <tspan fill="#0f172a" font-weight="700">Posting / Rotation Out</tspan></text>
      <text x="0" y="82" font-weight="600">⚙️ Record 4 Sealed: <tspan fill="#b91c1c" font-weight="700">validUntil=12:00</tspan></text>
      <text x="0" y="104" fill="#64748b" font-size="11" font-weight="600">⏱️ Record 5: state=REVOKED</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="942" y1="180" x2="968" y2="180" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrowNext)"/>

  <!-- ==================== CARD 4: 02:00 PM / LATER AUDIT (PURPLE) ==================== -->
  <g transform="translate(975, 30)">
    <rect x="0" y="24" width="275" height="280" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2.5" filter="url(#cardShadow)"/>
    <g filter="url(#pillShadow)">
      <rect x="52" y="5" width="170" height="38" rx="19" fill="url(#purplePill)"/>
      <text x="137" y="30" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="0.5">02:00 PM (AUDIT)</text>
    </g>

    <!-- Icon -->
    <g transform="translate(112, 58)">
      <circle cx="22" cy="22" r="14" fill="none" stroke="#7c3aed" stroke-width="5"/>
      <line x1="33" y1="33" x2="44" y2="44" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    </g>

    <text x="137" y="132" fill="#6d28d9" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0.5">HISTORICAL QUERY</text>

    <!-- Inquiry Question & Contract Return Value -->
    <g transform="translate(15, 146)">
      <rect x="0" y="0" width="245" height="38" rx="6" fill="#f3e8ff" stroke="#e9d5ff"/>
      <text x="10" y="16" fill="#581c87" font-size="10.5" font-weight="700">"Was 11:32 AM access to</text>
      <text x="10" y="30" fill="#581c87" font-size="10.5" font-weight="700">RADAR-TRX-09 authorized?"</text>
      
      <!-- Actual Contract Return Value Box -->
      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="245" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
        <text x="10" y="18" fill="#065f46" font-size="11" font-weight="900">checkPermissionAtTime(11:32)</text>
        <g font-family="monospace" font-size="9.5" fill="#047857" font-weight="700">
          <text x="10" y="34">returns Permission {</text>
          <text x="18" y="48">state: GRANTED, id: 4,</text>
          <text x="18" y="60">validFrom: 10:00, validUntil: 12:00 }</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== TIMELINE PROGRESS BAR (BOTTOM) ==================== -->
  <g transform="translate(30, 340)">
    <line x1="137" y1="12" x2="1112" y2="12" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="137" y1="12" x2="797" y2="12" stroke="#0284c7" stroke-width="4"/>

    <circle cx="137" cy="12" r="10" fill="#16a34a" stroke="#ffffff" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="482" cy="12" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="797" cy="12" r="10" fill="#dc2626" stroke="#ffffff" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="1112" cy="12" r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="3" filter="url(#cardShadow)"/>

    <!-- Policy Span Green Box -->
    <rect x="10" y="32" width="600" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="310" y="52" fill="#15803d" font-size="12.5" font-weight="900" text-anchor="middle">Permission ID 4: State GRANTED (10:00 AM – 12:00 PM)</text>
    <text x="310" y="68" fill="#166534" font-size="10.5" font-weight="700" text-anchor="middle">Access at 11:32 AM falls within validFrom &lt;= t &lt; validUntil</text>

    <!-- Policy Span Red Box -->
    <rect x="640" y="32" width="570" height="42" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="925" y="52" fill="#b91c1c" font-size="12.5" font-weight="900" text-anchor="middle">Permission ID 5: State REVOKED (12:00 PM Onwards)</text>
    <text x="925" y="68" fill="#991b1b" font-size="10.5" font-weight="700" text-anchor="middle">Appended to history; earlier 11:32 AM record remains intact</text>
  </g>
</svg>
