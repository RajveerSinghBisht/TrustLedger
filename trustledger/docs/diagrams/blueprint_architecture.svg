<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="900" fill="url(#grid)" />
  </g>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
  <circle cx="70" cy="54" r="14" fill="#06b6d4" opacity="0.2" />
  <circle cx="70" cy="54" r="6" fill="#06b6d4" />
  <text x="96" y="59" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">PRAMAAN — Detailed Multi-Tier System Architecture Blueprint</text>
  <rect x="990" y="40" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1065" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BEL // SIH 26125</text>

  <!-- TIER 1: Presentation Layer -->
  <rect x="40" y="104" width="1120" height="150" rx="10" fill="url(#cardGrad1)" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="56" y="92" width="280" height="24" rx="4" fill="#0284c7" />
  <text x="70" y="108" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. PRESENTATION LAYER (:3001)</text>

  <!-- Tier 1 Sub-cards -->
  <rect x="60" y="130" width="240" height="106" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="152" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Client Interfaces</text>
  <text x="75" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Web Browser Client</text>
  <text x="75" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• MetaMask (secp256k1)</text>
  <text x="75" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• EIP-191 / EIP-712 Signer</text>

  <rect x="320" y="130" width="480" height="106" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="335" y="152" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Next.js 16.3 App Router Modules</text>
  <g font-family="system-ui, monospace" font-size="11" fill="#cbd5e1">
    <text x="335" y="176">/ (Landing &amp; Showcase)</text>
    <text x="335" y="196">/identities (DID Registry)</text>
    <text x="335" y="216">/assets (Mint &amp; Catalog)</text>
    <text x="540" y="176">/permissions (Dynamic RBAC)</text>
    <text x="540" y="196">/policy-check (Auditor Portal)</text>
    <text x="540" y="216">/download &amp; /verify (Proof)</text>
  </g>

  <rect x="820" y="130" width="320" height="106" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="835" y="152" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Client Services &amp; State</text>
  <text x="835" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• AuthProvider (In-Memory JWT Session)</text>
  <text x="835" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• wallet.ts (ethers.js v6 Browser Provider)</text>
  <text x="835" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• api.ts (HTTP Client + Bearer Auth Token)</text>

  <!-- Connectors: Tier 1 to Tier 2 -->
  <path d="M 600 254 L 600 286" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="520" y="260" width="160" height="18" rx="4" fill="#0c4a6e"/>
  <text x="600" y="273" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REST / JSON / Multipart</text>

  <!-- TIER 2: API & Orchestration Layer -->
  <rect x="40" y="290" width="1120" height="260" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="56" y="278" width="320" height="24" rx="4" fill="#059669" />
  <text x="70" y="294" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. API &amp; ORCHESTRATION LAYER (:3000)</text>

  <!-- Tier 2: Middleware pipeline -->
  <rect x="60" y="316" width="1080" height="42" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="342" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Security Gateways:</text>
  <rect x="200" y="324" width="170" height="26" rx="4" fill="#1e293b"/><text x="285" y="341" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Helmet OWASP Headers</text>
  <rect x="380" y="324" width="180" height="26" rx="4" fill="#1e293b"/><text x="470" y="341" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Tiered IP Rate Limiters</text>
  <rect x="570" y="324" width="180" height="26" rx="4" fill="#1e293b"/><text x="660" y="341" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Zod Input Validation</text>
  <rect x="760" y="324" width="180" height="26" rx="4" fill="#1e293b"/><text x="850" y="341" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">authenticateJWT.ts</text>
  <rect x="950" y="324" width="180" height="26" rx="4" fill="#1e293b"/><text x="1040" y="341" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">CORS Whitelist Guard</text>

  <!-- Tier 2: Services -->
  <rect x="60" y="370" width="340" height="164" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="75" y="394" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">API Controllers &amp; Routes</text>
  <text x="75" y="418" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">• /api/auth (Challenge &amp; Verify)</text>
  <text x="75" y="440" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">• /api/identities (Register &amp; Lookup)</text>
  <text x="75" y="462" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">• /api/assets (Upload &amp; Download)</text>
  <text x="75" y="484" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">• /api/permissions (RBAC &amp; Policy Verify)</text>
  <text x="75" y="506" fill="#94a3b8" font-family="system-ui, monospace" font-size="11">• /api/proof-bundles (Offline Verifier)</text>

  <rect x="420" y="370" width="370" height="164" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="435" y="394" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Core Engines &amp; Cryptography</text>
  <text x="435" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• documentEncryption.ts (AES-256-GCM Envelope)</text>
  <text x="435" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• proofBundle.ts (EIP-191 ECDSA Signer)</text>
  <text x="435" y="462" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• authService.ts (EIP-191 Challenge Nonce Generator)</text>
  <text x="435" y="484" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• authorizationService.ts (Fresh On-Chain Guard)</text>
  <text x="435" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Contract Adapters (ethers.js v6 Relayer Calls)</text>

  <rect x="810" y="370" width="330" height="164" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="825" y="394" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Repositories &amp; Key Perimeter</text>
  <text x="825" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Prisma Client Repositories (4 Models)</text>
  <text x="825" y="440" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">• DOCUMENT_MASTER_KEY (Envelope Wrap)</text>
  <text x="825" y="462" fill="#f87171" font-family="system-ui, sans-serif" font-size="11">• RELAYER_PRIVATE_KEY (EVM Transactions)</text>
  <text x="825" y="484" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11">• BACKEND_SIGNING_PRIVATE_KEY (Proofs)</text>
  <text x="825" y="506" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Startup Invariant Assertions (K1 ≠ K2)</text>

  <!-- Connectors: Tier 2 to Tier 3 & Tier 4 -->
  <path d="M 300 550 L 300 596" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="220" y="562" width="160" height="18" rx="4" fill="#0c4a6e"/>
  <text x="300" y="575" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Prisma ORM (TCP:5432)</text>

  <path d="M 900 550 L 900 596" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="800" y="562" width="200" height="18" rx="4" fill="#2e1065"/>
  <text x="900" y="575" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ethers.js JSON-RPC (HTTP:8545)</text>

  <!-- TIER 3: Storage Layer (Left Bottom) -->
  <rect x="40" y="600" width="530" height="260" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="56" y="588" width="300" height="24" rx="4" fill="#0284c7" />
  <text x="70" y="604" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. OFF-CHAIN PERSISTENCE (POSTGRESQL 16)</text>

  <g transform="translate(60, 626)">
    <rect x="0" y="0" width="240" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">users</text>
    <text x="15" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• did (PK, string)</text>
    <text x="15" y="62" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• display_name (PII)</text>
    <text x="15" y="80" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• email (never on-chain)</text>

    <rect x="250" y="0" width="240" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="265" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">encrypted_records</text>
    <text x="265" y="44" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• metadata_uri (PK)</text>
    <text x="265" y="62" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• encrypted_blob + iv + tag</text>
    <text x="265" y="80" fill="#fbbf24" font-family="system-ui, monospace" font-size="10">• wrapped_data_key (AES)</text>

    <rect x="0" y="112" width="240" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">audit_log</text>
    <text x="15" y="156" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• id (PK, auto-increment)</text>
    <text x="15" y="174" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• event_type, actor_did</text>
    <text x="15" y="192" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• tx_hash (chain mirror)</text>

    <rect x="250" y="112" width="240" height="100" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="265" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">auth_challenges</text>
    <text x="265" y="156" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• id, nonce (128-bit hex)</text>
    <text x="265" y="174" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• did, expected_address</text>
    <text x="265" y="192" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">• consumed (anti-replay)</text>
  </g>

  <!-- TIER 4: Blockchain Layer (Right Bottom) -->
  <rect x="590" y="600" width="570" height="260" rx="10" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="606" y="588" width="340" height="24" rx="4" fill="#6d28d9" />
  <text x="620" y="604" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. CONSORTIUM BLOCKCHAIN (CANCUN EVM :8545)</text>

  <g transform="translate(610, 626)">
    <!-- Contract 1 -->
    <rect x="0" y="0" width="170" height="212" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="10" y="10" width="70" height="18" rx="3" fill="#3b82f6"/><text x="45" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DEPLOY 1ST</text>
    <text x="10" y="44" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IdentityRegistry</text>
    <text x="10" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Roles &amp; DIDs</text>
    <text x="10" y="80" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• registerIdentity()</text>
    <text x="10" y="98" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• revokeIdentity()</text>
    <text x="10" y="116" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• resolveDID()</text>
    <text x="10" y="134" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• isActive()</text>
    <text x="10" y="152" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• getRole()</text>
    <text x="10" y="180" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Events:</text>
    <text x="10" y="196" fill="#38bdf8" font-family="system-ui, monospace" font-size="9">• IdentityRegistered</text>

    <!-- Contract 2 -->
    <rect x="180" y="0" width="180" height="212" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="190" y="10" width="70" height="18" rx="3" fill="#10b981"/><text x="225" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DEPLOY 2ND</text>
    <text x="190" y="44" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AccessControl</text>
    <text x="190" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Temporal Timelines</text>
    <text x="190" y="80" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• setPermission()</text>
    <text x="190" y="98" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• checkPermissionNow()</text>
    <text x="190" y="116" fill="#10b981" font-family="system-ui, monospace" font-size="9" font-weight="700">• checkPermissionAtTime()</text>
    <text x="190" y="134" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• recordAccess()</text>
    <text x="190" y="180" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Events:</text>
    <text x="190" y="196" fill="#10b981" font-family="system-ui, monospace" font-size="9">• AssetAccessed (Log)</text>

    <!-- Contract 3 -->
    <rect x="370" y="0" width="160" height="212" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="380" y="10" width="70" height="18" rx="3" fill="#8b5cf6"/><text x="415" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DEPLOY 3RD</text>
    <text x="380" y="44" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AssetRegistry</text>
    <text x="380" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ERC-721 Tokens</text>
    <text x="380" y="80" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• registerAsset()</text>
    <text x="380" y="98" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• transferAsset()</text>
    <text x="380" y="116" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• updateAssetVersion()</text>
    <text x="380" y="134" fill="#94a3b8" font-family="system-ui, monospace" font-size="9">• getAsset()</text>
    <text x="380" y="180" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Events:</text>
    <text x="380" y="196" fill="#a78bfa" font-family="system-ui, monospace" font-size="9">• AssetRegistered</text>
  </g>
</svg>
