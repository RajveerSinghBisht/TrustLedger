<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowAudit" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="url(#bgGrad6)"/>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="54" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="68" cy="47" r="10" fill="#06b6d4" opacity="0.2"/>
  <circle cx="68" cy="47" r="5" fill="#06b6d4"/>
  <text x="90" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Flow 5: Temporal "Policy-at-the-Time" Historical Audit Verification</text>
  <rect x="880" y="34" width="160" height="26" rx="13" fill="#164e63"/>
  <text x="960" y="51" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BEL Problem 26125</text>

  <!-- Problem Statement Comparison Header -->
  <g transform="translate(40, 95)">
    <!-- Legacy RBAC Failure -->
    <rect x="0" y="0" width="500" height="110" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.2"/>
    <text x="20" y="28" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">❌ The Legacy RBAC Vulnerability (Mutable State)</text>
    <text x="20" y="52" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11">Engineer Alice accessed classified radar telemetry in 2024.</text>
    <text x="20" y="70" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11">Her clearance was revoked in 2026. Traditional SQL RBAC query:</text>
    <text x="20" y="92" fill="#ffffff" font-family="monospace" font-size="11">SELECT role FROM users; -- Result: 'REVOKED' -&gt; "ILLEGAL ACCESS"</text>

    <!-- PRAMAAN Mathematical Proof -->
    <rect x="520" y="0" width="500" height="110" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
    <text x="540" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ The PRAMAAN Solution (Append-Only Timeline)</text>
    <text x="540" y="52" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">PRAMAAN scans the immutable versioned timeline for timestamp T:</text>
    <text x="540" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Permission(T) = Policy_k where validFrom &lt;= T &lt; validUntil</text>
    <text x="540" y="92" fill="#6ee7b7" font-family="monospace" font-size="11">Proves 100% mathematically that 2024 access was 100% LAWFUL.</text>
  </g>

  <!-- Main Workflow Box -->
  <g transform="translate(40, 225)">
    <rect width="1020" height="375" rx="8" fill="url(#cardGrad6)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="20" y="16" width="70" height="20" rx="3" fill="#0891b2"/><text x="55" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AUDIT FLOW</text>
    <text x="100" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Mathematical Historical Verification Architecture</text>

    <!-- Step 1: Query Input -->
    <rect x="20" y="55" width="280" height="150" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. Auditor Submits Query</text>
    <text x="35" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Portal: <tspan fill="#e2e8f0">/policy-check</tspan></text>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="35" y="126">Asset ID:     1042</text>
      <text x="35" y="146">Subject DID:  did:trustledger:&lt;USER_ADDRESS&gt;</text>
      <text x="35" y="166">Action:       READ (0)</text>
      <text x="35" y="186" fill="#fbbf24">Historical T: 1717200000 (2024)</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 300 130 L 335 130" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowAudit)"/>

    <!-- Step 2: Contract Execution -->
    <rect x="345" y="55" width="370" height="150" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="360" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. Smart Contract Evaluation</text>
    <text x="360" y="102" fill="#a78bfa" font-family="monospace" font-size="10">AccessControl.checkPermissionAtTime(1042, did, READ, T)</text>
    <g font-family="monospace" font-size="10" fill="#94a3b8">
      <text x="360" y="126">1. Compute key = keccak256(1042, did, READ)</text>
      <text x="360" y="146">2. Linear scan over _permissions[key]:</text>
      <text x="375" y="166" fill="#cbd5e1">if (P.validFrom &lt;= T &amp;&amp; (P.validUntil &gt; T || 0)):</text>
      <text x="390" y="186" fill="#34d399">return P (Version #1: GRANTED)</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 715 130 L 750 130" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowAudit)"/>

    <!-- Step 3: Verified Result -->
    <rect x="760" y="55" width="240" height="150" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="775" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. Mathematical Verdict</text>
    <rect x="775" y="96" width="210" height="34" rx="4" fill="#065f46"/>
    <text x="880" y="118" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ WAS LEGITIMATE</text>
    <g font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      <text x="775" y="150">Active Version: #1</text>
      <text x="775" y="170">State at T: GRANTED</text>
      <text x="775" y="190">Granted By: did:trustledger:&lt;ADMIN_ADDRESS&gt;</text>
    </g>

    <!-- Visual Timeline Bar -->
    <text x="20" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Visual Temporal Timeline Representation:</text>
    
    <g transform="translate(20, 250)">
      <!-- Timeline Axis -->
      <line x1="20" y1="50" x2="960" y2="50" stroke="#334155" stroke-width="4"/>
      
      <!-- Version 1 Span (Granted) -->
      <rect x="80" y="32" width="380" height="36" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
      <text x="270" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POLICY VERSION #1: GRANTED</text>
      <circle cx="80" cy="50" r="6" fill="#10b981"/>
      <text x="80" y="86" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">2024-01-01 (T0)</text>

      <!-- Auditor Query Marker -->
      <line x1="240" y1="12" x2="240" y2="80" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
      <circle cx="240" cy="50" r="8" fill="#f59e0b"/>
      <rect x="170" y="0" width="140" height="22" rx="3" fill="#78350f"/>
      <text x="240" y="15" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">QUERY TIMESTAMP T</text>

      <!-- Version 2 Span (Revoked) -->
      <rect x="460" y="32" width="460" height="36" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="690" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POLICY VERSION #2: REVOKED</text>
      <circle cx="460" cy="50" r="6" fill="#ef4444"/>
      <text x="460" y="86" fill="#f87171" font-family="monospace" font-size="10" text-anchor="middle">2026-01-01 (T1: Revoked)</text>
      <text x="920" y="86" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Present (Indefinite)</text>
    </g>
  </g>
</svg>
