<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1100" height="680" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <rect x="40" y="20" width="1020" height="54" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="68" cy="47" r="10" fill="#10b981" opacity="0.2"/>
  <circle cx="68" cy="47" r="5" fill="#10b981"/>
  <text x="90" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Flow 2: Zero-Trust Asset Ingestion &amp; Dual-Tier Envelope Encryption</text>
  <rect x="880" y="34" width="160" height="26" rx="13" fill="#064e3b"/>
  <text x="960" y="51" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AES-256-GCM + ERC-721</text>

  <!-- Step 1: Admin & Frontend Upload -->
  <g transform="translate(40, 100)">
    <rect width="280" height="150" rx="8" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="60" height="20" rx="3" fill="#0284c7"/><text x="44" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 1</text>
    <text x="84" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Admin Upload &amp; Client</text>
    <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Admin selects document (PDF/ZIP)</text>
    <text x="14" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Classification: [CONFIDENTIAL]</text>
    <text x="14" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• In-memory JWT attached (ADMIN)</text>
    <rect x="14" y="112" width="252" height="24" rx="4" fill="#0c4a6e"/>
    <text x="140" y="128" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">POST /api/assets (multipart)</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 320 175 L 392 175" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 2: Backend Auth & Guard -->
  <g transform="translate(400, 100)">
    <rect width="300" height="150" rx="8" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="14" y="14" width="60" height="20" rx="3" fill="#059669"/><text x="44" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 2</text>
    <text x="84" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Zero-Trust Auth &amp; Guard</text>
    <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Validate JWT signature &amp; expiry</text>
    <text x="14" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Fresh On-Chain Contract Checks:</text>
    <text x="24" y="96" fill="#cbd5e1" font-family="monospace" font-size="10">IdentityRegistry.isActive(admin)</text>
    <text x="24" y="114" fill="#cbd5e1" font-family="monospace" font-size="10">IdentityRegistry.getRole() == ADMIN</text>
    <text x="14" y="136" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Strict Server Guard Passed</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 700 175 L 772 175" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 3: Cryptographic Pipeline -->
  <g transform="translate(780, 100)">
    <rect width="280" height="240" rx="8" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="14" y="14" width="60" height="20" rx="3" fill="#d97706"/><text x="44" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 3</text>
    <text x="84" y="30" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Envelope Cryptography</text>
    
    <text x="14" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1. SHA-256 Content Fingerprint:</text>
    <text x="24" y="74" fill="#cbd5e1" font-family="monospace" font-size="10">H = SHA256(rawBytes)</text>

    <text x="14" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2. Ephemeral AES Key Gen:</text>
    <text x="24" y="118" fill="#cbd5e1" font-family="monospace" font-size="10">DEK = crypto.randomBytes(32)</text>

    <text x="14" y="144" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">3. Payload Encryption:</text>
    <text x="24" y="162" fill="#cbd5e1" font-family="monospace" font-size="10">AES-256-GCM(bytes, DEK)</text>

    <text x="14" y="188" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">4. Master Key Wrapping:</text>
    <text x="24" y="206" fill="#fbbf24" font-family="monospace" font-size="10">AES-256-GCM(DEK, MASTER_KEY)</text>
    <text x="14" y="226" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">(DEK is instantly wiped from RAM)</text>
  </g>

  <!-- Flow Down from Step 3 to Split Path -->
  <path d="M 920 340 L 920 400" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 920 400 L 260 400 L 260 442" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 920 400 L 760 400 L 760 442" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 4A: PostgreSQL Off-Chain Storage -->
  <g transform="translate(40, 450)">
    <rect width="440" height="190" rx="8" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="3" fill="#0284c7"/><text x="49" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 4A</text>
    <text x="94" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Off-Chain Database Insertion</text>
    <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Prisma Client writes to <tspan font-family="monospace" fill="#e2e8f0">encrypted_records</tspan>:</text>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="14" y="80">• metadata_uri: "local://records/&lt;uuid&gt;"</text>
      <text x="14" y="100">• encrypted_blob: &lt;ciphertext bytes&gt;</text>
      <text x="14" y="120">• iv: &lt;initialization vector&gt; | auth_tag</text>
      <text x="14" y="140" fill="#fbbf24">• wrapped_data_key: &lt;wrapped DEK&gt;</text>
      <text x="14" y="160">• original_filename: "radar_schematic.pdf"</text>
    </g>
    <rect x="14" y="166" width="412" height="18" rx="2" fill="#082f49"/>
    <text x="220" y="179" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Confidentiality Guarantee: No plaintext is ever written to disk or database</text>
  </g>

  <!-- Step 4B: Blockchain On-Chain Minting -->
  <g transform="translate(540, 450)">
    <rect width="520" height="190" rx="8" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="3" fill="#6d28d9"/><text x="49" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STEP 4B</text>
    <text x="94" y="30" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ERC-721 Immutable Token Minting</text>
    <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Relayer calls <tspan font-family="monospace" fill="#e2e8f0">AssetRegistry.registerAsset(H, ownerDID, uri, CONFIDENTIAL)</tspan>:</text>
    <g font-family="monospace" font-size="10" fill="#cbd5e1">
      <text x="14" y="80">1. assetCounter++ -&gt; assigns new unique assetId (e.g. 1042)</text>
      <text x="14" y="100">2. _safeMint(ownerAddress, assetId) [OpenZeppelin ERC-721]</text>
      <text x="14" y="120">3. Stores Asset struct: { assetHash: H, metadataURI, status: ACTIVE }</text>
      <text x="14" y="140" fill="#a78bfa">4. Emits AssetRegistered(assetId=1042, assetHash, ownerDID, metadataURI)</text>
    </g>
    <rect x="14" y="156" width="492" height="24" rx="4" fill="#2e1065"/>
    <text x="260" y="172" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Integrity Anchored: Transaction hash returned to Admin UI (201 Created)</text>
  </g>
</svg>
